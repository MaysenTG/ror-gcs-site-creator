# Replace default server; listen only on 8080 (Fly http_service).
server {
  listen 8080 default_server;
  server_name _;
  client_max_body_size 50m;

  location = /up {
    proxy_pass http://127.0.0.1:3000/up;
    proxy_set_header Host $host;
  }

  location / {
    set $backend_uri $request_uri;
    set $backend_host $host;

    # Platform app hosts only. Everything else (incl. test-app.maysengreenwood.com)
    # is treated as a customer custom domain → site lookup.
    if ($host !~* "^(code\.maysengreenwood\.com|static-site-creator\.fly\.dev|localhost)$") {
      set $backend_uri /admin/proxy/site/lookup?name=$host;
    }

    proxy_pass http://127.0.0.1:3000$backend_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $backend_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
  }
}
