# Included inside http {} via /etc/nginx/conf.d/
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      "";
}

# Replace default server; listen only on 8080 (Fly http_service).
server {
  listen 8080 default_server;
  server_name _;
  client_max_body_size 50m;

  location = /up {
    proxy_pass http://127.0.0.1:3000/up;
    proxy_set_header Host $host;
  }

  # ActionCable needs Upgrade/Connection forwarded (not stripped).
  location /cable {
    proxy_pass http://127.0.0.1:3000/cable;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  location / {
    set $backend_uri $request_uri;
    set $backend_host $host;

    # Platform app hosts only. Everything else is a customer custom domain → site lookup.
    if ($host !~* "^(code\.maysengreenwood\.com|static-site-creator\.fly\.dev|localhost)$") {
      set $backend_uri /admin/proxy/site/lookup?name=$host;
    }

    proxy_pass http://127.0.0.1:3000$backend_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $backend_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}
