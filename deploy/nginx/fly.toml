# Custom-domain edge for Gusto Cloud.
# Customers point A records at this app's dedicated IPv4.
#
#   fly apps create gusto-cloud-nginx
#   fly ips allocate-v4 -a gusto-cloud-nginx
#   fly deploy -c deploy/nginx/fly.toml -a gusto-cloud-nginx
#
# Then update Admin::DomainsController @a_record_ip to the allocated address.

app = "gusto-cloud-nginx"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/up"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
