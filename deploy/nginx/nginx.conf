worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 50m;

  # Rails app on the private Fly network
  upstream gusto_rails {
    server gusto-cloud.internal:3000;
  }

  # Platform hosts → Rails directly
  # Custom customer hosts → lookup endpoint (iframe / domain resolve)
  map $host $gusto_upstream_uri {
    default                              /admin/proxy/site/lookup;
    ~*^(?:www\.)?maysengreenwood\.com$   $request_uri;
    ~*^[^.]+\.maysengreenwood\.com$      $request_uri;
    ~*^gusto-cloud\.fly\.dev$            $request_uri;
    ~*^gusto-cloud-nginx\.fly\.dev$      $request_uri;
  }

  map $host $gusto_proxy_host {
    default                              gusto-cloud.internal;
    ~*^(?:www\.)?maysengreenwood\.com$   $host;
    ~*^[^.]+\.maysengreenwood\.com$      $host;
    ~*^gusto-cloud\.fly\.dev$            $host;
    ~*^gusto-cloud-nginx\.fly\.dev$      gusto-cloud.internal;
  }

  server {
    listen 8080;
    server_name _;

    location = /up {
      proxy_pass http://gusto_rails/up;
      proxy_set_header Host gusto-cloud.internal;
    }

    location / {
      # Custom domains: pass Host as ?name= for the lookup action
      set $target_uri $gusto_upstream_uri;
      if ($gusto_upstream_uri = /admin/proxy/site/lookup) {
        set $target_uri /admin/proxy/site/lookup?name=$host;
      }

      proxy_pass http://gusto_rails$target_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $gusto_proxy_host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 120s;
    }
  }
}
