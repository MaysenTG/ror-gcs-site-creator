worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 50m;

  upstream rails_app {
    server static-site-creator.internal:3000;
  }

  # Platform hosts → Rails directly
  # Custom customer hosts → lookup endpoint
  map $host $upstream_uri {
    default                                      /admin/proxy/site/lookup;
    ~*^(?:www\.)?maysengreenwood\.com$           $request_uri;
    ~*^[^.]+\.maysengreenwood\.com$              $request_uri;
    ~*^static-site-creator\.fly\.dev$            $request_uri;
    ~*^static-site-creator-nginx\.fly\.dev$      $request_uri;
  }

  map $host $proxy_host {
    default                                      static-site-creator.internal;
    ~*^(?:www\.)?maysengreenwood\.com$           $host;
    ~*^[^.]+\.maysengreenwood\.com$              $host;
    ~*^static-site-creator\.fly\.dev$            $host;
    ~*^static-site-creator-nginx\.fly\.dev$      static-site-creator.internal;
  }

  server {
    listen 8080;
    server_name _;

    location = /up {
      proxy_pass http://rails_app/up;
      proxy_set_header Host static-site-creator.internal;
    }

    location / {
      set $target_uri $upstream_uri;
      if ($upstream_uri = /admin/proxy/site/lookup) {
        set $target_uri /admin/proxy/site/lookup?name=$host;
      }

      proxy_pass http://rails_app$target_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 120s;
    }
  }
}
