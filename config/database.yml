default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "maysen") %>

development:
  <<: *default
  database: ror_site_creator_development

test:
  <<: *default
  database: ror_site_creator_test

# Cheap Fly deploy: SQLite on a persistent volume (/data).
# Local/dev stays on Postgres above.
production:
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  database: <%= ENV.fetch("DATABASE_PATH", "storage/production.sqlite3") %>
