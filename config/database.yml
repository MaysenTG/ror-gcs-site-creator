default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "maysen") %>

development:
  <<: *default
  database: ror_site_creator_development

test:
  <<: *default
  database: ror_site_creator_test

production:
  <<: *default
  # Fly.io / managed Postgres provides DATABASE_URL.
  url: <%= ENV["DATABASE_URL"] %>
  database: ror_site_creator_production
