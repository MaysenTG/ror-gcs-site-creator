# Single Fly Machine: Rails + SQLite volume. No nginx.
#
#   fly volumes create data --region syd --size 1 -a static-site-creator
#   fly secrets set SECRET_KEY_BASE=... R2_*=...
#   fly deploy
# App hostname: code.maysengreenwood.com (fly certs + DNS)
# Custom domains: DNS check only (CNAME/A); not proxied by this app.

app = "static-site-creator"
primary_region = "syd"
console_command = "/rails/bin/rails console"

[build]

[deploy]
  # Migrations run in bin/docker-entrypoint against the mounted /data volume.

[env]
  RAILS_ENV = "production"
  RAILS_LOG_TO_STDOUT = "1"
  RAILS_SERVE_STATIC_FILES = "1"
  PORT = "8080"
  DATABASE_PATH = "/data/production.sqlite3"
  APP_HOST = "code.maysengreenwood.com"
  APP_ORIGIN = "https://code.maysengreenwood.com"
  SITE_PREVIEW_VIA_APP = "1"
  CUSTOM_DOMAIN_CNAME = "static-site-creator.fly.dev"
  ACTIVE_JOB_ADAPTER = "async"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "90s"
    method = "GET"
    path = "/up"

[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
