# Single Fly Machine (~$2–5/mo): Rails + SQLite volume + nginx for custom domains.
# No Managed Postgres. No separate Redis/nginx apps.
#
#   fly volumes create data --region syd --size 1 -a static-site-creator
#   fly secrets set SECRET_KEY_BASE=... R2_*=...
#   fly deploy
# Custom domains: CNAME → static-site-creator.fly.dev (free)
# App hostname: code.maysengreenwood.com (fly certs add + DNS)
#   or: fly ips allocate-v4 -a static-site-creator  (~+$2/mo) then set CUSTOM_DOMAIN_IP

app = "static-site-creator"
primary_region = "syd"
console_command = "/rails/bin/rails console"

[build]

[deploy]
  # Migrations run in bin/docker-entrypoint against the mounted /data volume.
  # (Fly release_command machines do not share the app volume.)


[env]
  RAILS_ENV = "production"
  RAILS_LOG_TO_STDOUT = "1"
  RAILS_SERVE_STATIC_FILES = "1"
  PORT = "3000"
  DATABASE_PATH = "/data/production.sqlite3"
  APP_HOST = "code.maysengreenwood.com"
  APP_ORIGIN = "https://code.maysengreenwood.com"
  SITE_PREVIEW_VIA_APP = "1"
  CUSTOM_DOMAIN_CNAME = "static-site-creator.fly.dev"
  ACTIVE_JOB_ADAPTER = "async"

[http_service]
  internal_port = 8080
  force_https = true
  # Suspend wakes faster than full stop; still $0 when idle.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    # Boot runs db:prepare before nginx answers /up.
    grace_period = "90s"
    method = "GET"
    path = "/up"

[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
