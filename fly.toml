# Fly.io app config — prepare only (do not deploy from this change set).
# Create resources, then deploy when ready:
#   fly apps create gusto-cloud
#   fly mpg create --name gusto-cloud-db
#   fly redis create
#   fly secrets set SECRET_KEY_BASE=... R2_ACCOUNT_ID=... R2_ACCESS_KEY_ID=... R2_SECRET_ACCESS_KEY=... R2_ENDPOINT=... R2_BUCKET=... R2_PUBLIC_BASE_URL=...
#   fly deploy
#
# Scale after first deploy:
#   fly scale count web=1 worker=1

app = "gusto-cloud"
primary_region = "syd"
console_command = "/rails/bin/rails console"

[build]

[deploy]
  release_command = "bundle exec rails db:prepare"

[env]
  RAILS_ENV = "production"
  RAILS_LOG_TO_STDOUT = "1"
  RAILS_SERVE_STATIC_FILES = "1"
  PORT = "3000"

[processes]
  web = "./bin/rails server -b 0.0.0.0"
  worker = "bundle exec sidekiq -C config/sidekiq.yml"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
    method = "GET"
    path = "/up"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["web"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]
