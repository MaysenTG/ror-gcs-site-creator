<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/theme_previews/skeleton_react/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Password required</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .gate { max-width: 22rem; margin: 4rem auto; padding: 1.5rem; }
    .gate h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
    .gate p { margin: 0 0 1rem; opacity: 0.8; }
    .gate label { display: block; margin-bottom: 0.35rem; font-weight: 600; }
    .gate input[type="text"],
    .gate input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.75rem;
      margin-bottom: 0.85rem;
      border: 1px solid rgba(0,0,0,0.2);
      border-radius: 0.45rem;
      font: inherit;
    }
    .gate button {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 0;
      border-radius: 0.45rem;
      background: #0d7a6c;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .gate-error {
      display: none;
      background: #fdecea;
      color: #b42318;
      padding: 0.55rem 0.7rem;
      border-radius: 0.4rem;
      margin-bottom: 0.85rem;
    }
    .gate-error.is-visible { display: block; }
  </style>
</head>
<body>
  <main class="gate">
    <h1>This site is private</h1>
    <p>Enter the visitor password to continue.</p>
    <div class="gate-error" data-gate-error>__GATE_ERROR__</div>
    <form action="__GATE_ACTION__" method="post">
      <input type="hidden" name="authenticity_token" value="__CSRF__">
      <input type="hidden" name="return_to" value="__RETURN_TO__">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Unlock site</button>
    </form>
  </main>
</body>
</html>
